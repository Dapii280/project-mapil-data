<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Supabase</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; line-height: 1.5; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    input, button { padding: 10px; font-size: 14px; }
    button { cursor: pointer; background: #0070f3; color: white; border: none; border-radius: 4px; }
    .item-card { border: 1px solid #ccc; padding: 10px 15px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .btn-delete { background: #e53e3e; }
  </style>
</head>
<body>

  <h2>Aplikasi CRUD Items</h2>

  <form id="crud-form">
    <input type="text" id="title" placeholder="Judul item..." required>
    <input type="text" id="description" placeholder="Deskripsi item..." required>
    <button type="submit">Tambah Item</button>
  </form>

  <hr>

  <h3>Daftar Item</h3>
  <div id="items-list">Loading data...</div>

  <script src="app.js"></script>
</body>
</html>
